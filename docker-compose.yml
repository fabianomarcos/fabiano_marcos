services:
  n8n:
    build:
      context: .
      dockerfile: ./src/n8n/Dockerfile
    ports:
      - '5678:5678'
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  n8n_data:
